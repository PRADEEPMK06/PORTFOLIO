name: Deploy Portfolio to S3

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: pradeepmk-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Latest LeetCode Data
        run: node scripts/fetch-leetcode.js

      - name: Build Next.js Application
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Website to S3
        run: |
          aws s3 sync out/ s3://${{ env.S3_BUCKET }} --delete

      - name: Deployment Complete
        run: echo "Portfolio deployed successfully."